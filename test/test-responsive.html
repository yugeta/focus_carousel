<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>レスポンシブテスト - Focus Carousel</title>
  <link rel="stylesheet" href="../src/css/style.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
    h2 { color: #555; margin-top: 40px; }
    .test-section {
      margin: 40px 0;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    .test-console {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 20px;
    }
    .test-console .success { color: #4ec9b0; }
    .test-console .error { color: #f48771; }
    .test-console .info { color: #569cd6; }
    .description {
      background: #fff;
      padding: 15px;
      border-left: 4px solid #17a2b8;
      margin: 10px 0;
    }
    .resize-hint {
      background: #d1ecf1;
      border: 1px solid #bee5eb;
      padding: 15px;
      border-radius: 4px;
      margin: 10px 0;
    }
    .viewport-info {
      background: #fff;
      padding: 10px;
      border-radius: 4px;
      margin: 10px 0;
      font-family: monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>

<h1>Focus Carousel - レスポンシブテスト</h1>

<div class="description">
  <strong>テスト内容:</strong>
  <ul>
    <li>画面リサイズ時の動作</li>
    <li>異なるビューポートサイズでの表示</li>
    <li>中心位置の再計算</li>
  </ul>
</div>

<div class="resize-hint">
  <strong>テスト方法:</strong><br>
  ブラウザウィンドウをリサイズして、カルーセルが正しく再計算されることを確認してください。
</div>

<div class="viewport-info" id="viewport-info">
  ビューポート: <span id="viewport-size"></span>
</div>

<div class="test-section">
  <h2>レスポンシブカルーセル</h2>
  <p>ウィンドウをリサイズしても正しく動作することを確認。</p>
  
  <div class="carousel" role="region" aria-label="レスポンシブテスト" id="carousel1">
    <figure>
      <div class="item" role="group"><img src="../src/img/001.jpg" alt="画像 1"></div>
      <div class="item" role="group"><img src="../src/img/002.jpg" alt="画像 2"></div>
      <div class="item" role="group"><img src="../src/img/003.jpg" alt="画像 3"></div>
      <div class="item" role="group"><img src="../src/img/004.jpg" alt="画像 4"></div>
      <div class="item" role="group"><img src="../src/img/005.jpg" alt="画像 5"></div>
    </figure>
  </div>
</div>

<div class="test-console" id="console"></div>

<script type="module">
  import { Carousel } from "../src/js/carousel.js"
  
  const consoleEl = document.getElementById('console')
  const viewportSize = document.getElementById('viewport-size')
  
  function log(message, type = 'info') {
    const time = new Date().toLocaleTimeString()
    const span = document.createElement('div')
    span.className = type
    span.textContent = `[${time}] ${message}`
    consoleEl.appendChild(span)
    consoleEl.scrollTop = consoleEl.scrollHeight
  }
  
  function updateViewportInfo() {
    const width = window.innerWidth
    const height = window.innerHeight
    let device = 'デスクトップ'
    if (width < 768) device = 'モバイル'
    else if (width < 1024) device = 'タブレット'
    viewportSize.textContent = `${width}x${height}px (${device})`
  }
  
  function runTests() {
    log('=== レスポンシブテスト開始 ===', 'info')
    
    try {
      new Carousel()
      log('✓ カルーセル初期化成功', 'success')
      
      updateViewportInfo()
      log(`✓ 初期ビューポート: ${window.innerWidth}x${window.innerHeight}px`, 'success')
      
      // リサイズイベントの監視
      let resizeCount = 0
      window.addEventListener('resize', () => {
        resizeCount++
        updateViewportInfo()
        log(`ℹ リサイズイベント検出 (${resizeCount}回目): ${window.innerWidth}x${window.innerHeight}px`, 'info')
      })
      
      log('=== レスポンシブテスト準備完了 ===', 'info')
      log('ℹ ブラウザウィンドウをリサイズしてください', 'info')
      log('ℹ リサイズ後もカルーセルが正しく動作することを確認', 'info')
      
    } catch (error) {
      log(`✗ エラーが発生しました: ${error.message}`, 'error')
      console.error(error)
    }
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', runTests)
  } else {
    runTests()
  }
</script>

</body>
</html>
