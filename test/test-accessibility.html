<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>アクセシビリティテスト - Focus Carousel</title>
  <link rel="stylesheet" href="../src/css/style.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
    h2 { color: #555; margin-top: 40px; }
    .test-section {
      margin: 40px 0;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    .test-console {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 20px;
    }
    .test-console .success { color: #4ec9b0; }
    .test-console .error { color: #f48771; }
    .test-console .info { color: #569cd6; }
    .description {
      background: #fff;
      padding: 15px;
      border-left: 4px solid #28a745;
      margin: 10px 0;
    }
    .keyboard-hint {
      background: #fff3cd;
      border: 1px solid #ffc107;
      padding: 15px;
      border-radius: 4px;
      margin: 10px 0;
    }
    .keyboard-hint kbd {
      background: #333;
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>
<body>

<h1>Focus Carousel - アクセシビリティテスト</h1>

<div class="description">
  <strong>テスト内容:</strong>
  <ul>
    <li>ARIA属性の確認</li>
    <li>キーボード操作（Tab、矢印キー）</li>
    <li>フォーカス管理</li>
    <li>スクリーンリーダー対応</li>
  </ul>
</div>

<div class="keyboard-hint">
  <strong>キーボード操作:</strong><br>
  <kbd>Tab</kbd> - カルーセルにフォーカス移動<br>
  <kbd>←</kbd> - 左にスクロール<br>
  <kbd>→</kbd> - 右にスクロール
</div>

<div class="test-section">
  <h2>テスト1: キーボード操作</h2>
  <p>Tabキーでフォーカスし、矢印キーでスクロールしてください。</p>
  
  <div class="carousel" role="region" aria-label="キーボード操作テスト" id="carousel1">
    <figure>
      <div class="item" role="group" aria-label="画像 1">
        <img src="../src/img/001.jpg" alt="風景写真 1">
      </div>
      <div class="item" role="group" aria-label="画像 2">
        <img src="../src/img/002.jpg" alt="風景写真 2">
      </div>
      <div class="item" role="group" aria-label="画像 3">
        <img src="../src/img/003.jpg" alt="風景写真 3">
      </div>
      <div class="item" role="group" aria-label="画像 4">
        <img src="../src/img/004.jpg" alt="風景写真 4">
      </div>
      <div class="item" role="group" aria-label="画像 5">
        <img src="../src/img/005.jpg" alt="風景写真 5">
      </div>
    </figure>
  </div>
</div>

<div class="test-console" id="console"></div>

<script type="module">
  import { Carousel } from "../src/js/carousel.js"
  
  const consoleEl = document.getElementById('console')
  
  function log(message, type = 'info') {
    const time = new Date().toLocaleTimeString()
    const span = document.createElement('div')
    span.className = type
    span.textContent = `[${time}] ${message}`
    consoleEl.appendChild(span)
    consoleEl.scrollTop = consoleEl.scrollHeight
  }
  
  function runTests() {
    log('=== アクセシビリティテスト開始 ===', 'info')
    
    try {
      new Carousel()
      log('✓ カルーセル初期化成功', 'success')
      
      // ARIA属性のチェック
      const carousel = document.querySelector('.carousel')
      
      if (carousel.getAttribute('role') === 'region') {
        log('✓ role="region" が設定されています', 'success')
      } else {
        log('✗ role属性が不正です', 'error')
      }
      
      if (carousel.hasAttribute('aria-label')) {
        log(`✓ aria-label="${carousel.getAttribute('aria-label')}" が設定されています`, 'success')
      } else {
        log('✗ aria-label属性がありません', 'error')
      }
      
      // アイテムのARIA属性チェック
      const items = document.querySelectorAll('.item')
      let itemAriaValid = true
      items.forEach((item, index) => {
        if (item.getAttribute('role') !== 'group') {
          log(`✗ アイテム${index + 1}のrole属性が不正です`, 'error')
          itemAriaValid = false
        }
        if (!item.hasAttribute('aria-label')) {
          log(`✗ アイテム${index + 1}にaria-label属性がありません`, 'error')
          itemAriaValid = false
        }
      })
      if (itemAriaValid) {
        log(`✓ すべてのアイテム（${items.length}個）にARIA属性が設定されています`, 'success')
      }
      
      // alt属性のチェック
      const images = document.querySelectorAll('.carousel img')
      let altValid = true
      images.forEach((img, index) => {
        if (!img.hasAttribute('alt')) {
          log(`✗ 画像${index + 1}にalt属性がありません`, 'error')
          altValid = false
        } else if (img.getAttribute('alt') === '') {
          log(`⚠ 画像${index + 1}のalt属性が空です`, 'info')
        }
      })
      if (altValid) {
        log(`✓ すべての画像（${images.length}個）にalt属性が設定されています`, 'success')
      }
      
      // tabindex属性のチェック
      const figure = document.querySelector('.carousel figure')
      if (figure.getAttribute('tabindex') === '0') {
        log('✓ figure要素にtabindex="0"が設定されています', 'success')
      } else {
        log('✗ figure要素のtabindex属性が不正です', 'error')
      }
      
      // キーボードイベントリスナーのチェック
      log('ℹ キーボードイベントリスナーが登録されているか確認中...', 'info')
      
      log('=== アクセシビリティテスト完了 ===', 'info')
      log('ℹ 手動で以下を確認してください:', 'info')
      log('  - Tabキーでカルーセルにフォーカスできる', 'info')
      log('  - 左矢印キーで左にスクロールする', 'info')
      log('  - 右矢印キーで右にスクロールする', 'info')
      log('  - スクリーンリーダーで適切に読み上げられる', 'info')
      
    } catch (error) {
      log(`✗ エラーが発生しました: ${error.message}`, 'error')
      console.error(error)
    }
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', runTests)
  } else {
    runTests()
  }
</script>

</body>
</html>
